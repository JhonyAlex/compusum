# Configuración de GitGuardian para este repositorio
# (mecanismo oficial del GitHub App de GitGuardian).
#
# ALCANCE ESTRECHO: solo se ignoran los fixtures de tests automatizados.
# Son valores PÚBLICOS inventados (compuestos además en runtime vía
# tests/helpers/credentials.ts) que simulan contraseñas para probar hash y
# validación. NO se ignoran rutas de producción ni se desactivan detectores:
# cualquier secreto en src/, prisma/, scripts/ o configuración sigue siendo
# detectado con normalidad.
paths-ignore:
  - "tests/**"
