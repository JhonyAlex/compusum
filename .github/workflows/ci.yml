name: CI Pipeline

on:
  push:
    branches: [ main, master, dev, develop ]
  pull_request:
    branches: [ main, master, dev, develop ]

jobs:
  ci:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/compusum_db?schema=public"
      NEXTAUTH_SECRET: "ci-secret-key-32-chars-long-test"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Run Prisma Client Generation
        run: bunx prisma generate

      - name: Run Linter
        run: bun run lint

      - name: Run Unit Tests
        run: bun run test

      - name: Run Application Build
        run: bun run build
